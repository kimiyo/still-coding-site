<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="숫자합 퍼즐 아이콘">
  <rect width="256" height="256" fill="#fff8ef"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">
    <!-- 3 + 7 -->
    <rect x="34" y="42" width="72" height="72" rx="12" fill="#18746b"/>
    <text x="70" y="94" font-size="48" fill="#fff8ef">3</text>
    <text x="128" y="92" font-size="44" fill="#c9472c">+</text>
    <rect x="150" y="42" width="72" height="72" rx="12" fill="#18746b"/>
    <text x="186" y="94" font-size="48" fill="#fff8ef">7</text>
    <!-- = 10 -->
    <text x="70" y="188" font-size="44" fill="#c9472c">=</text>
    <rect x="98" y="136" width="124" height="76" rx="12" fill="#d99f2b" stroke="#18211f" stroke-width="4"/>
    <text x="160" y="192" font-size="52" fill="#18211f">10</text>
  </g>
</svg>
